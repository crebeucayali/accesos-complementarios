name: Validar panel de uso de recursos MEA
on:
  pull_request:
    paths:
      - 'admin/index.html'
      - 'admin/admin.js'
      - 'admin/admin.css'
      - 'admin/estadisticas-recursos.js'
      - 'admin/estadisticas-uso-util.js'
      - 'admin/tests/estadisticas-recursos.browser.mjs'
      - '.github/workflows/validar-panel-recursos-mea.yml'
  workflow_dispatch:
jobs:
  interfaz:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check admin/admin.js
      - run: node --check admin/estadisticas-recursos.js
      - run: node --check admin/estadisticas-uso-util.js
      - run: node admin/tests/estadisticas-recursos.browser.mjs
