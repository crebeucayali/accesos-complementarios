name: Validar visualización de BDA en panel EVA
on:
  pull_request:
    paths:
      - 'admin/index.html'
      - 'admin/admin.js'
      - 'admin/estadisticas-bda.js'
      - 'admin/tests/estadisticas-bda-panel.browser.mjs'
      - '.github/workflows/validar-panel-bda.yml'
  workflow_dispatch:
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check admin/estadisticas-bda.js
      - run: node --check admin/admin.js
      - run: node admin/tests/estadisticas-bda-panel.browser.mjs
