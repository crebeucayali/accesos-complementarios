name: Fase 9 Etapa 4 - Inyeccion semantica temporal

on:
  push:
    branches: [fase-9-etapa-4-semantica]
    paths:
      - '.github/workflows/fase-9-etapa-4-inject.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener rama controlada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fase-9-etapa-4-semantica

      - name: Incorporar datos estructurados en la portada
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          canonical = 'https://crebeucayali.github.io/accesos-complementarios/'
          title = 'Accesos Complementarios | CREBE Ucayali'
          description = 'Accesos Complementarios del CREBE Ucayali: entrada a páginas generales de orientación, contacto, directorio, registro de visita y enlaces institucionales.'
          assert f'<title>{title}</title>' in html
          assert f'<link rel="canonical" href="{canonical}">' in html
          assert 'application/ld+json' not in html
          assert "script-src 'self';" in html
          data = {'@context':'https://schema.org','@graph':[
            {'@type':'EducationalOrganization','@id':'https://crebeucayali.github.io/#organization','name':'CREBE Señor de los Milagros - Ucayali','alternateName':'CREBE Ucayali','url':'https://crebeucayali.github.io/','logo':'https://crebeucayali.github.io/accesos-complementarios/logo-crebe.webp'},
            {'@type':'WebSite','@id':'https://crebeucayali.github.io/#website','name':'CREBE Señor de los Milagros Región Ucayali','url':'https://crebeucayali.github.io/','publisher':{'@id':'https://crebeucayali.github.io/#organization'}},
            {'@type':'WebPage','@id':canonical+'#webpage','url':canonical,'name':title,'description':description,'isPartOf':{'@id':'https://crebeucayali.github.io/#website'},'publisher':{'@id':'https://crebeucayali.github.io/#organization'},'inLanguage':'es-PE'}]}
          payload = json.dumps(data, ensure_ascii=False, indent=2)
          script_body = '\n' + payload + '\n'
          digest = base64.b64encode(hashlib.sha256(script_body.encode()).digest()).decode()
          script_tag = '<script type="application/ld+json">' + script_body + '</script>\n'
          html = html.replace(f'<title>{title}</title>\n', f'<title>{title}</title>\n{script_tag}', 1)
          html = html.replace("script-src 'self';", f"script-src 'self' 'sha256-{digest}';", 1)
          match = re.search(r'<script type="application/ld\+json">([\s\S]*?)</script>', html)
          assert match and base64.b64encode(hashlib.sha256(match.group(1).encode()).digest()).decode() == digest
          path.write_text(html, encoding='utf-8')
          PY
      - name: Confirmar alcance y publicar en la rama
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          git config user.name "CREBE SEO controlled automation"
          git config user.email "senordelosmilagroscrebe@gmail.com"
          git add index.html
          git commit -m "Fase 9 Etapa 4: añadir identidad semántica"
          git push origin HEAD:fase-9-etapa-4-semantica
