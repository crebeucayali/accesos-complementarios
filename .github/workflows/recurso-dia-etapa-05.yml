name: Recurso del día - etapa 05 motor diario
on:
  push:
    branches: [feature/eva-recurso-dia-etapa-05-rotacion]
    paths:
      - 'admin/index.html'
      - 'admin/recurso-dia.js'
      - 'admin/recurso-dia-fuentes.js'
      - 'admin/tests/recurso-dia-etapa-05-browser.cjs'
      - 'admin/tests/recurso-dia-etapa-04-browser.cjs'
      - '.github/workflows/recurso-dia-etapa-05.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verificar sintaxis
        run: |
          node --check admin/recurso-dia.js
          node --check admin/recurso-dia-fuentes.js
          node --check admin/tests/recurso-dia-etapa-05-browser.cjs
      - name: Motor diario y programación segura
        run: node admin/tests/recurso-dia-etapa-05-browser.cjs
      - name: Regresión integración de catálogos
        run: node admin/tests/recurso-dia-etapa-04-browser.cjs
      - name: Regresión calendario y borradores
        run: node admin/tests/recurso-dia-etapa-03-browser.cjs
