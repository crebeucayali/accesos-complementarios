name: SEO Etapa 3 helper
# helper temporal: aplicar canonical faltante
on:
  push:
    branches: [seo/fase-9-etapa-3-metadata]
    paths: [.github/workflows/seo-etapa3-helper.yml]
permissions:
  contents: write
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: seo/fase-9-etapa-3-metadata
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python .github/seo-etapa3-helper.py
      - run: |
          git config user.name 'CREBE SEÑOR DE LOS MILAGROS'
          git config user.email 'senordelosmilagroscrebe@gmail.com'
          git add paginas recursos
          git diff --cached --quiet || git commit -m 'Fase 9 Etapa 3: completar canonical de rutas públicas'
          git push origin HEAD:seo/fase-9-etapa-3-metadata
