name: Validar visitas EVA
on:
  pull_request:
    paths:
      - 'estadisticas/visitas-eva.js'
      - 'admin/tests/visitas-sesion-resiliente.test.cjs'
      - 'admin/tests/visitas-integracion.browser.mjs'
      - '.github/workflows/validar-visitas-pr.yml'
      - 'supabase/migrations/20261111014000_aislar_funcion_publica_visitas_eva.sql'
      - 'supabase/migrations/20261111020000_visitas_idempotentes_v2.sql'
      - 'admin/tests/sql-visitas-*.sql'
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check estadisticas/visitas-eva.js
      - run: node --test admin/tests/visitas-sesion-resiliente.test.cjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node admin/tests/visitas-integracion.browser.mjs

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: eva_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Preparar esquema de prueba
        run: psql -v ON_ERROR_STOP=1 -f admin/tests/sql-visitas-bootstrap.sql
      - name: Aplicar migración en PostgreSQL temporal
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261111014000_aislar_funcion_publica_visitas_eva.sql
      - name: Aplicar migración idempotente en PostgreSQL temporal
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261111020000_visitas_idempotentes_v2.sql
      - name: Comprobar rol público, hitos y agregados
        run: psql -v ON_ERROR_STOP=1 -f admin/tests/sql-visitas-verificacion.sql
